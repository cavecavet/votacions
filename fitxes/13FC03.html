<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotosCavet00003 - Fitxa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .image-id {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .image-section {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .image-section img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-row.full {
            grid-template-columns: 1fr;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save {
            background: #667eea;
            color: white;
        }
        
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #d0d0d0;
        }
        
        .btn-export {
            background: #17a2b8;
            color: white;
            font-size: 12px;
            padding: 10px 16px;
        }
        
        .btn-export:hover {
            background: #138496;
        }
        
        .save-indicator {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 13px;
            font-weight: 600;
        }
        
        .save-indicator.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .save-indicator.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .save-indicator.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FotosCavet00003</h1>
        <p class="image-id">ID: 13FC03</p>
        
        <div class="image-section">
            <img src="../images/FotosCavet00003.jpg" alt="{titulo}" loading="lazy">
        </div>
        
        <form id="cardForm">
            <div class="form-group">
                <label for="imageAuthor">Autor de la imatge</label>
                <input type="text" id="imageAuthor" name="imageAuthor" placeholder="Nom de l'autor">
            </div>
            
            <div class="form-group">
                <label for="cardAuthor">Autor de la fitxa</label>
                <input type="text" id="cardAuthor" name="cardAuthor" placeholder="Nom de qui fa la fitxa">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="commonName">Nom comú</label>
                    <input type="text" id="commonName" name="commonName" placeholder="Ex: Ocelot">
                </div>
                <div class="form-group">
                    <label for="scientificName">Nom científic</label>
                    <input type="text" id="scientificName" name="scientificName" placeholder="Ex: Leopardus pardalis">
                </div>
            </div>
            
            <div class="form-group">
                <label for="comment">Comentari</label>
                <textarea id="comment" name="comment" placeholder="Afegeix comentaris sobre la imatge..."></textarea>
            </div>
            
            <div class="button-group">
                <button type="reset" class="btn-reset">Esborrar</button>
                <button type="submit" class="btn-save">Guardar</button>
                <button type="button" class="btn-export" id="exportBtn">Exportar JSON</button>
            </div>
            
            <div class="save-indicator" id="saveIndicator"></div>
        </form>
    </div>
    
    <script>
        const cardId = '13FC03';
        const storageKey = `fitxa_${cardId}`;
        const cardsDataUrl = 'cards_data.json';
        
        // Load card data from localStorage or JSON
        async function loadCardData() {
            try {
                // First try localStorage
                const saved = localStorage.getItem(storageKey);
                if (saved) {
                    const data = JSON.parse(saved);
                    populateForm(data);
                    console.log('Loaded from localStorage');
                    return;
                }
                
                // If not in localStorage, load from JSON
                const response = await fetch(cardsDataUrl);
                if (response.ok) {
                    const allCards = await response.json();
                    const cardData = allCards.find(card => card.id === cardId);
                    
                    if (cardData) {
                        populateForm(cardData);
                        console.log('Loaded from cards_data.json');
                    }
                }
            } catch (err) {
                console.error('Error loading card data:', err);
            }
        }
        
        function populateForm(data) {
            document.getElementById('imageAuthor').value = data.imageAuthor || '';
            document.getElementById('cardAuthor').value = data.cardAuthor || '';
            document.getElementById('commonName').value = data.commonName || '';
            document.getElementById('scientificName').value = data.scientificName || '';
            document.getElementById('comment').value = data.comment || '';
        }
        
        // Get form data
        function getFormData() {
            return {
                id: cardId,
                imageAuthor: document.getElementById('imageAuthor').value,
                cardAuthor: document.getElementById('cardAuthor').value,
                commonName: document.getElementById('commonName').value,
                scientificName: document.getElementById('scientificName').value,
                comment: document.getElementById('comment').value,
                lastSaved: new Date().toISOString()
            };
        }
        
        // Save form data to localStorage
        document.getElementById('cardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = getFormData();
            
            try {
                localStorage.setItem(storageKey, JSON.stringify(data));
                
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '✓ Fitxa guardada al navegador';
                indicator.className = 'save-indicator success';
                
                setTimeout(() => {
                    indicator.classList.remove('success');
                }, 3000);
            } catch (err) {
                console.error('Error saving data:', err);
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '✗ Error al guardar la fitxa';
                indicator.className = 'save-indicator error';
            }
        });
        
        // Export button
        document.getElementById('exportBtn').addEventListener('click', function() {
            const data = getFormData();
            const jsonString = JSON.stringify(data, null, 2);
            
            // Copy to clipboard
            navigator.clipboard.writeText(jsonString).then(() => {
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '✓ JSON copiat al porta-retalls';
                indicator.className = 'save-indicator info';
                
                setTimeout(() => {
                    indicator.classList.remove('info');
                }, 3000);
            }).catch(err => {
                console.error('Error copying to clipboard:', err);
            });
        });
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadCardData);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotosCavet00028 - Fitxa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .image-id {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .image-section {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .image-section img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="text"],
        textarea,
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-row.full {
            grid-template-columns: 1fr;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-end;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save {
            background: #667eea;
            color: white;
        }
        
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #d0d0d0;
        }
        
        .rating-group {
            display: flex;
            gap: 10px;
        }
        
        .star {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s;
            color: #ddd;
            user-select: none;
        }
        
        .star:hover,
        .star.active {
            color: #ffc107;
            transform: scale(1.2);
        }
        
        .save-indicator {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 13px;
            font-weight: 600;
        }
        
        .save-indicator.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .save-indicator.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FotosCavet00028</h1>
        <p class="image-id">ID: FotosCavet00028</p>
        
        <div class="image-section">
            <img src="../images/FotosCavet00028.JPG" alt="FotosCavet00028" loading="lazy">
        </div>
        
        <form id="cardForm">
            <div class="form-group">
                <label for="imageAuthor">Autor de la imatge</label>
                <input type="text" id="imageAuthor" name="imageAuthor" placeholder="Nom de l'autor">
            </div>
            
            <div class="form-group">
                <label for="cardAuthor">Autor de la fitxa</label>
                <input type="text" id="cardAuthor" name="cardAuthor" placeholder="Nom de qui fa la fitxa">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="commonName">Nom comú</label>
                    <input type="text" id="commonName" name="commonName" placeholder="Ex: Ocelot">
                </div>
                <div class="form-group">
                    <label for="scientificName">Nom científic</label>
                    <input type="text" id="scientificName" name="scientificName" placeholder="Ex: Leopardus pardalis">
                </div>
            </div>
            
            <div class="form-group">
                <label for="comment">Comentari</label>
                <textarea id="comment" name="comment" placeholder="Afegeix comentaris sobre la imatge..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="rating">Valoració</label>
                    <div class="rating-group">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                    <input type="hidden" id="rating" name="rating" value="0">
                </div>
                <div class="form-group">
                    <label for="order">Ordre</label>
                    <input type="number" id="order" name="order" min="1" placeholder="Número d'ordre">
                </div>
            </div>
            
            <div class="button-group">
                <button type="reset" class="btn-reset">Esborrar</button>
                <button type="submit" class="btn-save">Guardar</button>
            </div>
            
            <div class="save-indicator" id="saveIndicator"></div>
        </form>
    </div>
    
    <script>
        const imageId = 'FotosCavet00028';
        const storageKey = `fitxa_${imageId}`;
        
        // Initialize form with saved data
        function loadFormData() {
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('imageAuthor').value = data.imageAuthor || '';
                document.getElementById('cardAuthor').value = data.cardAuthor || '';
                document.getElementById('commonName').value = data.commonName || '';
                document.getElementById('scientificName').value = data.scientificName || '';
                document.getElementById('comment').value = data.comment || '';
                document.getElementById('order').value = data.order || '';
                
                if (data.rating) {
                    document.getElementById('rating').value = data.rating;
                    document.querySelectorAll('.star').forEach(star => {
                        if (parseInt(star.dataset.value) <= data.rating) {
                            star.classList.add('active');
                        }
                    });
                }
            }
        }
        
        // Handle star rating
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                const rating = this.dataset.value;
                document.getElementById('rating').value = rating;
                
                document.querySelectorAll('.star').forEach(s => {
                    if (parseInt(s.dataset.value) <= rating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });
        
        // Save form data
        document.getElementById('cardForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                imageAuthor: document.getElementById('imageAuthor').value,
                cardAuthor: document.getElementById('cardAuthor').value,
                commonName: document.getElementById('commonName').value,
                scientificName: document.getElementById('scientificName').value,
                comment: document.getElementById('comment').value,
                rating: document.getElementById('rating').value,
                order: document.getElementById('order').value,
                lastSaved: new Date().toISOString()
            };
            
            try {
                localStorage.setItem(storageKey, JSON.stringify(data));
                
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '✓ Fitxa guardada correctament';
                indicator.className = 'save-indicator success';
                
                setTimeout(() => {
                    indicator.classList.remove('success');
                }, 3000);
            } catch (err) {
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '✗ Error al guardar la fitxa';
                indicator.className = 'save-indicator error';
            }
        });
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadFormData);
    </script>
</body>
</html>
